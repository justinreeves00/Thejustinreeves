name: Deploy personal site to IONOS

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ionos-personal-site
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy over SFTP
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      IONOS_HOST: ${{ secrets.IONOS_SSH_HOST }}
      IONOS_USER: ${{ secrets.IONOS_SSH_USER }}
      IONOS_PORT: ${{ secrets.IONOS_SSH_PORT || '22' }}
      IONOS_SITE_PATH: ${{ secrets.IONOS_SITE_PATH }}
      IONOS_KNOWN_HOSTS: ${{ secrets.IONOS_KNOWN_HOSTS }}
      IONOS_SSH_KEY: ${{ secrets.IONOS_SSH_KEY }}
    steps:
      - name: Check out site
        uses: actions/checkout@v4

      - name: Validate deployment settings
        run: |
          set -euo pipefail
          for name in IONOS_HOST IONOS_USER IONOS_PORT IONOS_SITE_PATH IONOS_KNOWN_HOSTS IONOS_SSH_KEY; do
            [[ -n "${!name}" ]] || { echo "Missing required GitHub secret: $name" >&2; exit 1; }
          done
          [[ "$IONOS_PORT" =~ ^[0-9]+$ ]] || { echo "IONOS_SSH_PORT must be numeric." >&2; exit 1; }
          [[ "$IONOS_SITE_PATH" == /* ]] || { echo "IONOS_SITE_PATH must be an absolute remote path." >&2; exit 1; }
          [[ "$IONOS_SITE_PATH" != *"'"* ]] || { echo "IONOS_SITE_PATH cannot contain a single quote." >&2; exit 1; }

      - name: Configure SSH
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$IONOS_SSH_KEY" > ~/.ssh/ionos_deploy_key
          chmod 600 ~/.ssh/ionos_deploy_key
          printf '%s\n' "$IONOS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy site files
        run: |
          set -euo pipefail
          python3 - <<'PY' > deploy.sftp
          import os
          from pathlib import Path

          remote_root = os.environ["IONOS_SITE_PATH"].rstrip("/")
          excluded_dirs = {".git", ".github", "docs", "scan", "up"}
          excluded_files = {".DS_Store", ".gitignore", "README.md"}

          def quote(value: str) -> str:
              return '"' + value.replace("\\", "\\\\").replace('"', '\\"') + '"'

          files = []
          dirs = {remote_root}
          for path in Path(".").rglob("*"):
              rel = path.as_posix()
              parts = set(path.parts)
              if parts & excluded_dirs:
                  continue
              if path.name in excluded_files:
                  continue
              if path.is_dir():
                  dirs.add(f"{remote_root}/{rel}")
              elif path.is_file():
                  files.append((rel, f"{remote_root}/{rel}"))
                  for parent in path.parent.parents:
                      if parent.as_posix() == ".":
                          break
                      dirs.add(f"{remote_root}/{parent.as_posix()}")
                  if path.parent.as_posix() != ".":
                      dirs.add(f"{remote_root}/{path.parent.as_posix()}")

          for directory in sorted(dirs):
              print(f"-mkdir {quote(directory)}")
          for local, remote in sorted(files):
              print(f"put {quote(local)} {quote(remote)}")
          print("bye")
          PY

          sftp \
            -i "$HOME/.ssh/ionos_deploy_key" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -P "$IONOS_PORT" \
            -b deploy.sftp \
            "$IONOS_USER@$IONOS_HOST"

      - name: Verify public site
        run: |
          set -euo pipefail
          curl -fsSI --retry 3 https://thejustinreeves.com/ >/dev/null
          curl -fsSI --retry 3 https://thejustinreeves.com/resume/ >/dev/null
